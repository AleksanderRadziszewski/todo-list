trigger:
  - none

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - prod

variables:
  - group: "todo-app-variables-kv"
  - group: "todo-app-${{parameters.environment}}-variables"

stages:
  - stage: Build
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: Build
        displayName: Build job
        steps:
          - script: |
              sudo docker build -f backend/Dockerfile -t backend:$(Build.SourceVersion) backend/
              sudo docker images
              sudo docker images backend:latest --format "table {{.ID}}\t{{.Repository}}\t{{.Tag}}\t{{.CreatedAt}}"
              sudo docker login -u $(DOCKERHUB-USER) -p $(DOCKERHUB-PASSWORD)
              sudo docker image tag backend:$(Build.SourceVersion) $(DOCKERHUB-USER)/todo-app-backend:latest
              sudo docker image tag backend:$(Build.SourceVersion) $(DOCKERHUB-USER)/todo-app-backend:$(Build.SourceVersion)
              sudo docker push --all-tags $(DOCKERHUB-USER)/todo-app-backend
            displayName: Build and push backend image

          - task: UseNode@1
            inputs:
              version: "18.x"
            displayName: "Install Node.js"

          - script: |
              cd frontend
              npm install
            displayName: "Install dependencies"

          - script: |
              cd frontend
              echo "VITE_API_BASE_URL=$(VITE_API_BASE_URL)" > .env.production
              npm run build
            displayName: "Build React app with environment variable"

  - stage: Deploy
    displayName: Deploy
    jobs:
      - deployment: Deploy
        environment: ${{parameters.environment}}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - script: |
                    TERRAFORM_VERSION="1.14.4"
                    curl -fsSL -o terraform.zip https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
                    unzip terraform.zip
                    sudo mv terraform /usr/local/bin/terraform
                    terraform -version
                  displayName: Install Terraform
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: "todo-app-service-connection"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |

                      echo "Initializing backend"
                      terraform init -reconfigure -backend-config=environments/${{ parameters.environment }}/${{ parameters.environment }}.tfbackend

                      echo "Planning"
                      terraform plan -out=tfplan

                      echo "Upload tfplan to Storage"
                      az storage blob upload \
                        --account-name tfstatetodoapp \
                        --container-name plans \
                        --name tfplan-$(Build.BuildId) \
                        --file $(System.DefaultWorkingDirectory)/infra/tfplan \
                        --auth-mode login

                      echo "Applying"
                      terraform show tfplan
                      terraform apply -auto-approve tfplan
                    workingDirectory: $(System.DefaultWorkingDirectory)/infra
                  env:
                    ARM_SUBSCRIPTION_ID: $(subscription_id)
                    TF_VAR_environment: ${{ parameters.environment }}
                    TF_VAR_administrator_login: $(POSTGRES_USER)
                    TF_VAR_subscription_id: $(subscription_id)
                    TF_VAR_dockerhub_username: $(DOCKERHUB-USER)
                    TF_VAR_postgres_user: $(POSTGRES_USER)
                    TF_VAR_postgres_port: $(POSTGRES_PORT)
                    TF_VAR_postgres_db: $(POSTGRES_DB)
                  displayName: Build Infra

                - task: AzureCLI@2
                  displayName: Get SWA Deployment Token
                  inputs:
                    azureSubscription: "todo-app-service-connection"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      SWA_DEPLOYMENT_TOKEN=$(az staticwebapp secrets list \
                        --name todo-app-${{ parameters.environment }}-frontend-static \
                        --resource-group rg-todo-app-${{ parameters.environment }} \
                        --query "properties.apiKey" -o tsv)

                      echo "##vso[task.setvariable variable=SWA_DEPLOYMENT_TOKEN;issecret=true]$SWA_DEPLOYMENT_TOKEN"

                - task: AzureStaticWebApp@0
                  displayName: Deploy Azure Static Web App (${{ parameters.environment }})
                  inputs:
                    app_location: "/frontend"
                    output_location: "/dist"
                    azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)
